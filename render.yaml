services:
  - type: web
    name: atem-central-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_TIMEOUT_SECONDS
        value: "20"
      - key: CATALOG_URL
        value: https://metacatalog-c22c.onrender.com
      - key: CATALOG_TTL_SECONDS
        value: "300"
